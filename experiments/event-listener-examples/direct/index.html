<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이벤트 직접 연결 예제</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    #root { max-width: 360px; height: 300px; padding: 20px; border: 2px solid #888; }
    button { padding: 12px 24px; font-size: 18px; }
  </style>
</head>
<body>
  <div id="root">
    <h1>버튼 카운터</h1>
    <p>버튼을 누르면 숫자가 1씩 증가합니다.</p>
    <button id="increment" type="button">+1</button>
    <p>클릭 횟수: <strong id="count">0</strong></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
